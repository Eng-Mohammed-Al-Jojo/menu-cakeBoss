<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;family=Cinzel:wght@600;700&amp;display=swap');
      .badge-serif {
        font-family: 'Playfair Display', 'Cinzel', 'Times New Roman', serif;
        font-weight: 700;
        text-anchor: middle;
      }
      .badge-sub {
        font-family: 'Cinzel', 'Playfair Display', serif;
        font-weight: 600;
        letter-spacing: 0.36em;
        text-anchor: middle;
        font-size: 19px;
      }
      .swirl-stroke {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <radialGradient id="badgeBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#556441" />
      <stop offset="60%" stopColor="#434F34" />
      <stop offset="100%" stopColor="#333D27" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D4AF72" />
      <stop offset="50%" stopColor="#B79275" />
      <stop offset="100%" stopColor="#967455" />
    </linearGradient>
  </defs>

  <!-- Circular Base (Brand Sticker from Page 3) -->
  <circle cx="256" cy="256" r="250" fill="url(#badgeBg)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldBorder)" stroke-width="2" opacity="0.65" />
  
  <!-- Inner Delicate Ring with dots or dashes -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldBorder)" stroke-width="1" opacity="0.4" stroke-dasharray="6,4" />

  <!-- Content Group -->
  <g fill="#FAF6EE" stroke="#FAF6EE">
    <!-- ® symbol -->
    <text x="148" y="185" font-family="'Playfair Display', serif" font-size="15" font-weight="600" fill="#FAF6EE" stroke="none" opacity="0.85">®</text>

    <!-- Top Swirl Flourish -->
    <path d="M 235 155 
             C 220 145, 207 130, 223 110 
             C 237 92, 265 95, 269 114 
             C 273 132, 251 142, 240 138
             C 230 134, 227 124, 235 118
             C 241 114, 249 117, 247 123
             C 246 127, 241 128, 239 126" 
          class="swirl-stroke" stroke-width="3.5" fill="none" />
          
    <path d="M 235 155 
             C 250 165, 280 180, 265 200 
             C 257 210, 241 212, 230 208 
             C 205 198, 210 170, 223 150
             C 235 132, 265 125, 280 145
             C 290 160, 283 185, 260 195
             C 240 203, 217 192, 213 175" 
          class="swirl-stroke" stroke-width="2.5" fill="none" opacity="0.8" />

    <path d="M 223 188 C 235 180, 260 178, 273 188" class="swirl-stroke" stroke-width="3" fill="none" />

    <!-- CAKE Title -->
    <text x="256" y="255" class="badge-serif" font-size="86" letter-spacing="0.04em" stroke="none">CAKE</text>

    <!-- BOSS Title -->
    <text x="256" y="335" class="badge-serif" font-size="86" letter-spacing="0.05em" stroke="none">BOSS</text>

    <!-- Subtitle: CAKE & MORE -->
    <text x="262" y="380" class="badge-sub" fill="#D4AF72" stroke="none">CAKE &amp; MORE</text>

    <!-- Underline micro-accent -->
    <line x1="206" y1="392" x2="312" y2="392" stroke="#D4AF72" stroke-width="1.2" opacity="0.65" stroke-linecap="round" />
  </g>
</svg>
