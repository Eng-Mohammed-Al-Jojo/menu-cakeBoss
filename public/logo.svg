<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;family=Cinzel:wght@600;700&amp;display=swap');
      .logo-serif {
        font-family: 'Playfair Display', 'Cinzel', 'Times New Roman', serif;
        font-weight: 700;
        text-anchor: middle;
      }
      .logo-subtitle {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif;
        font-weight: 600;
        letter-spacing: 0.38em;
        text-anchor: middle;
        font-size: 19px;
      }
      .swirl-stroke {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Group with Olive Green coloring (Primary) -->
  <g id="cakeboss-logo" fill="#4A5638" stroke="#4A5638">
    
    <!-- Registered trademark ® top left -->
    <text x="145" y="145" font-family="'Playfair Display', serif" font-size="16" font-weight="600" fill="#4A5638" stroke="none">®</text>

    <!-- Top Graceful Swirl / Frosting flourish -->
    <!-- Outer loop and graceful curve across top of CAKE -->
    <path d="M 230 115 
             C 215 105, 202 90, 218 70 
             C 232 52, 260 55, 264 74 
             C 268 92, 246 102, 235 98
             C 225 94, 222 84, 230 78
             C 236 74, 244 77, 242 83
             C 241 87, 236 88, 234 86" 
          class="swirl-stroke" stroke-width="3.5" fill="none" />
          
    <path d="M 230 115 
             C 245 125, 275 140, 260 160 
             C 252 170, 236 172, 225 168 
             C 200 158, 205 130, 218 110
             C 230 92, 260 85, 275 105
             C 285 120, 278 145, 255 155
             C 235 163, 212 152, 208 135" 
          class="swirl-stroke" stroke-width="2.5" fill="none" opacity="0.85" />

    <!-- Additional delicate accent swirl connecting into CAKE -->
    <path d="M 218 148 C 230 140, 255 138, 268 148" class="swirl-stroke" stroke-width="3" fill="none" />

    <!-- CAKE Title -->
    <text x="250" y="215" class="logo-serif" font-size="88" letter-spacing="0.04em" stroke="none">CAKE</text>

    <!-- BOSS Title -->
    <text x="250" y="295" class="logo-serif" font-size="88" letter-spacing="0.05em" stroke="none">BOSS</text>

    <!-- Subtitle: CAKE & MORE -->
    <text x="256" y="340" class="logo-subtitle" fill="#B79275" stroke="none">CAKE &amp; MORE</text>

    <!-- Underline micro-accent for CAKE & MORE -->
    <line x1="200" y1="352" x2="306" y2="352" stroke="#B79275" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
  </g>
</svg>
