<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <style>
      .pat-line { stroke: #4A5638; stroke-width: 1.2; fill: none; opacity: 0.35; }
      .pat-thick { stroke: #4A5638; stroke-width: 1.8; fill: none; opacity: 0.5; }
      .pat-accent { stroke: #B79275; stroke-width: 1; fill: none; opacity: 0.4; }
      .pat-fill { fill: #4A5638; opacity: 0.4; }
      .pat-floret { fill: #B79275; opacity: 0.6; }
    </style>
  </defs>

  <!-- Outer diamond frame intersecting at edges -->
  <polygon points="40,0 80,40 40,80 0,40" class="pat-thick" />
  
  <!-- Inner diamond frame -->
  <polygon points="40,8 72,40 40,72 8,40" class="pat-line" />
  
  <!-- Subtle accent inner ring -->
  <polygon points="40,16 64,40 40,64 16,40" class="pat-accent" />

  <!-- Center 8-petal rosette star (Cake Boss brand motif) -->
  <!-- Center dot -->
  <circle cx="40" cy="40" r="2.5" class="pat-floret" />
  
  <!-- Cross petals -->
  <path d="M 40,31 C 38.5,34 38.5,36 40,37.5 C 41.5,36 41.5,34 40,31 Z" class="pat-floret" />
  <path d="M 40,49 C 38.5,46 38.5,44 40,42.5 C 41.5,44 41.5,46 40,49 Z" class="pat-floret" />
  <path d="M 31,40 C 34,38.5 36,38.5 37.5,40 C 36,41.5 34,41.5 31,40 Z" class="pat-floret" />
  <path d="M 49,40 C 46,38.5 44,38.5 42.5,40 C 44,41.5 46,41.5 49,40 Z" class="pat-floret" />

  <!-- Diagonal florets / dots -->
  <circle cx="34" cy="34" r="1.5" class="pat-fill" />
  <circle cx="46" cy="34" r="1.5" class="pat-fill" />
  <circle cx="34" cy="46" r="1.5" class="pat-fill" />
  <circle cx="46" cy="46" r="1.5" class="pat-fill" />

  <!-- Corner rosette quarters (connect seamlessly at tile borders) -->
  <circle cx="0" cy="0" r="2.5" class="pat-floret" />
  <circle cx="80" cy="0" r="2.5" class="pat-floret" />
  <circle cx="0" cy="80" r="2.5" class="pat-floret" />
  <circle cx="80" cy="80" r="2.5" class="pat-floret" />

  <!-- Corner diamond accents -->
  <polygon points="0,12 12,0 0,0" class="pat-line" />
  <polygon points="80,12 68,0 80,0" class="pat-line" />
  <polygon points="0,68 12,80 0,80" class="pat-line" />
  <polygon points="80,68 68,80 80,80" class="pat-line" />

  <!-- Corner flower petals radiating inward -->
  <path d="M 0,8 C 2,5 4,5 6,0" class="pat-line" />
  <path d="M 80,8 C 78,5 76,5 74,0" class="pat-line" />
  <path d="M 0,72 C 2,75 4,75 6,80" class="pat-line" />
  <path d="M 80,72 C 78,75 76,75 74,80" class="pat-line" />
</svg>
